      content_digest: "sha256:9c9ed0b9e1c08fb124dd31c5b45320c5a5bc2a81504fe3183e53094b4b89d0b8"
      role: required
      why: "Review a change for correctness, security and style before a human read"
    - slug: "security-audit-pipeline"
      version: "1.0.26"
      content_digest: "sha256:e29ea32f54e4621471d68a37abb88b314362ffe10a997f6b196a2953e07c4d81"
