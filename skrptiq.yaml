# --- Project template (GH#1102) ---
#
# This block is what makes the package a project template rather than a skrpt,
# and `entry_type` is DERIVED from its presence at publish time rather than from
# a flag a publisher must remember: a forgotten flag would publish this as a
# `skrpt`, which is the declared-kind-versus-reality defect the block avoids.
#
# A template is a GROUPING, not a bundle-of-bundles. The members are NOT
# vendored here and installation stays per-skrpt through the existing path.
#
# `skrpts` is ORDERED — the sequence a person meets the work in, which is what
# the app renders. Each member carries the version this template was authored
# against and the content digest Hub published for it, so an installer can
# verify what it resolved instead of trusting a version string that merely
# resolves.
#
# `role` is the template author's statement of what a missing member costs:
#   required — the project cannot do what it exists to do without it
#   optional — the project is poorer without it but still coherent
# Only the author knows which, and a part-way install cannot report itself
# honestly without it.
#
# No member counts are restated anywhere: the app derives them from this list.
project:
  name: "Software Project"
  preamble: "documents/software-project-preamble.md"
  skrpts:
    - slug: "feature-spec-pipeline"
      version: "1.1.30"
      content_digest: "sha256:821c8fcd343a833a51e23953b77d6c1bdd9de716a895a75a1b292f761df4def6"
      role: required
      why: "Turn an intent into a specification a developer can build against"
    - slug: "code-review-pipeline"
